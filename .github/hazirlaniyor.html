<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bu ders hazırlanıyor — YZ Dersler</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#830201" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <!-- Placed by .github/workflows/pages.yml at the address of every lesson in
       its HAZIRLANIYOR list; the lesson itself stays in the repository. -->
  <style>
    @font-face { font-family: 'Fraunces'; src: url('../assets/fonts/Fraunces-Variable.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: 'Instrument Sans'; src: url('../assets/fonts/InstrumentSans-Variable.ttf') format('truetype'); font-weight: 400 700; font-display: swap; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #830201; color: #fff; font-family: 'Instrument Sans', Helvetica, Arial, sans-serif; text-align: center; }
    .eyebrow { margin: 0 auto 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #fecaca; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: clamp(32px, 7vw, 52px); margin: 0 0 12px; }
    p { font-size: 18px; color: rgba(255, 255, 255, 0.88); max-width: 38ch; margin: 0 auto 24px; line-height: 1.5; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #fff; color: #dc2626; text-decoration: none; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.25); }
    a:hover { background: #f3f4f6; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">YZ Dersler</p>
    <h1>Bu ders hazırlanıyor</h1>
    <p>Bıdık bu ders için mutfağı hazırlıyor. Şimdilik ilk üç ders yayında; bu ders de çok yakında gelecek.</p>
    <a href="../">Yayındaki derslere git</a>
  </main>
</body>
</html>
