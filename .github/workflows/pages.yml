name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        env:
          # lessons that are not published yet: their address shows "Bu ders
          # hazırlanıyor" (.github/hazirlaniyor.html); remove a name to publish it
          HAZIRLANIYOR: neden-uydurur bidik-goruyor odulle-ogrenmek kapanis arama-ve-kurallar
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'serve.mjs' ./ _site/
          for lesson in $HAZIRLANIYOR; do
            test -d "_site/$lesson" || { echo "unknown lesson: $lesson"; exit 1; }
            rm -rf "_site/$lesson"
            mkdir "_site/$lesson"
            cp .github/hazirlaniyor.html "_site/$lesson/index.html"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
